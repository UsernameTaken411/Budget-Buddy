# Serves the Vite bundle.
#
# The try_files line is the important one: React Router owns /transactions,
# /profile etc. client-side, but nginx doesn't know that. Without the fallback
# to index.html, a hard refresh on any route other than / returns 404 — which
# looks exactly like a broken deploy during a demo.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames, so cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the shell — it references the hashed bundles.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
